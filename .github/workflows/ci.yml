name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    # .python-version pins 3.11; UV_PYTHON overrides it for every uv call.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Pin Python
        run: uv python install ${{ matrix.python-version }}
      - name: Sync
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Test
        # Overrides the default -m so the slow stage runs too.
        run: uv run pytest -m 'not e2e and not real_data'
      - name: Data-contract drift check
        run: uv run python scripts/gen_data_contract.py --check
      - name: Geneva fixture sidecar drift check
        run: uv run python tests/fixtures/geneva/build_geneva_fixture.py --check
      - name: MIMIC fixture sidecar drift check
        run: uv run python tests/fixtures/mimic/build_mimic_fixture.py --check
      - name: Geneva AI fixture drift check
        run: uv run python tests/fixtures/geneva_ai/build_geneva_ai_fixture.py --check
      - name: CLI smoke
        run: |
          uv run ehr-simulator validate-config \
            tests/fixtures/study/study_synthetic.yaml \
            tests/fixtures/study/questions.yaml
          uv run ehr-simulator validate-adapter \
            tests/fixtures/study/study_synthetic.yaml
          uv run ehr-simulator preflight \
            tests/fixtures/study/study_synthetic.yaml \
            tests/fixtures/study/questions.yaml
          uv run ehr-simulator preview \
            tests/fixtures/study/study_synthetic.yaml \
            --patient synth_001 \
            --questions tests/fixtures/study/questions.yaml \
            --html-out /tmp/preview_smoke
          test -s /tmp/preview_smoke/synth_001_t0.html
          grep -q 'id="questions-pane"' /tmp/preview_smoke/synth_001_t0.html
          grep -q 'data-t-index="2"' /tmp/preview_smoke/synth_001_t2.html
          grep -q 'id="advance-form"' /tmp/preview_smoke/synth_001_t2.html
      - name: DB smoke
        run: |
          rm -rf /tmp/ci_db_smoke /tmp/ci_db_backups
          mkdir -p /tmp/ci_db_smoke
          uv run ehr-simulator migrate --db-path /tmp/ci_db_smoke/test.db
          uv run ehr-simulator migrate --db-path /tmp/ci_db_smoke/test.db
          uv run ehr-simulator backup \
            --db-path /tmp/ci_db_smoke/test.db \
            --backup-dir /tmp/ci_db_backups
          test "$(ls /tmp/ci_db_backups/*.db | wc -l)" -ge 1
      - name: Export smoke
        run: |
          # Bind the smoke DB to the `example` study before exporting.
          # `migrate` deliberately stays config-independent (no identity
          # binding), so the study identity is set here via the public
          # study_identity API. The DB was already migrated above.
          uv run python - <<'PY'
          from pathlib import Path
          from ehr_simulator.db import connect, study_identity
          conn = connect(Path("/tmp/ci_db_smoke/test.db"))
          study_identity.bind(conn, "example")
          conn.close()
          PY
          uv run ehr-simulator export-answers \
            configs/example_config.yaml configs/example_questions.yaml \
            --db-path /tmp/ci_db_smoke/test.db \
            --out /tmp/ci_db_smoke/answers.csv \
            --pseudonym-secret /tmp/ci_db_smoke/pseudonym.secret \
            --keyfile /tmp/ci_db_smoke/clinicians.keyfile.csv
          test "$(head -1 /tmp/ci_db_smoke/answers.csv)" = \
            "patient_id,clinician_id,t_index,timepoint_minutes,timepoint_started_at,timepoint_ended_at,elapsed_seconds,arm,completed_at,config_hash,deterioration_6h,survives_hospital,good_outcome_3mo,dead_6mo,confidence,contributing_factors,free_notes"
          test "$(cat /tmp/ci_db_smoke/answers.csv | wc -l)" = "1"
          test "$(head -1 /tmp/ci_db_smoke/clinicians.keyfile.csv)" = "clinician_id,name_normalized"
          test "$(cat /tmp/ci_db_smoke/clinicians.keyfile.csv | wc -l)" = "1"
          test "$(stat -c %a /tmp/ci_db_smoke/clinicians.keyfile.csv)" = "600"
      - name: Phase 2 export smoke
        run: |
          # export-phase2 needs a study bound DB with an active configuration.
          rm -rf /tmp/ci_phase2_smoke
          mkdir -p /tmp/ci_phase2_smoke
          uv run ehr-simulator activate-config \
            configs/example_phase2_config.yaml configs/example_phase2_questions.yaml \
            --version v1 --description "CI smoke" \
            --db-path /tmp/ci_phase2_smoke/study.db
          uv run ehr-simulator export-phase2 configs/example_phase2_config.yaml \
            --db-path /tmp/ci_phase2_smoke/study.db \
            --out-dir /tmp/ci_phase2_smoke/bundle \
            --pseudonym-secret /tmp/ci_phase2_smoke/pseudonym.secret \
            --keyfile /tmp/ci_phase2_smoke/clinicians.keyfile.csv
          # Row counts from the manifest: CSV cells may hold newlines.
          uv run python - <<'PY'
          import json
          manifest = json.load(open("/tmp/ci_phase2_smoke/bundle/manifest.json"))
          rows = {name: f["rows"] for name, f in manifest["files"].items()}
          expected = {
              "timepoints.csv": 0, "answers.csv": 0, "panel_summaries.csv": 0,
              "behavioral_events.csv": 0, "randomisation_audit.csv": 0,
              "configuration_history.csv": 1, "configuration_counts.csv": 1,
              "clinicians.csv": 0,
          }
          assert rows == expected, rows
          assert manifest["included_config_versions"] == ["v1"], manifest
          PY
          test "$(head -1 /tmp/ci_phase2_smoke/clinicians.keyfile.csv)" = "clinician_id,name_normalized"
          test "$(stat -c %a /tmp/ci_phase2_smoke/clinicians.keyfile.csv)" = "600"
          test "$(stat -c %a /tmp/ci_phase2_smoke/pseudonym.secret)" = "600"

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Pin Python
        run: uv python install 3.11
      - name: Sync
        run: uv sync --locked
      - name: Cache Playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium
      - name: E2E
        run: uv run pytest -m e2e
