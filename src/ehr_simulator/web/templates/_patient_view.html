<div id="patient-view"
     data-patient-id="{{ patient_slice.patient_id }}"
     data-t-index="{{ patient_slice.timepoint_index }}"
     data-t-count="{{ timepoint_count }}"
     data-t-minutes="{{ patient_slice.t_minutes }}"
     data-chrome="{{ chrome }}">
    {{ summary_html | safe }}
    <div class="patient-layout{% if questions_html %} has-questions{% endif %}">
        <div class="patient-chrome">{{ chrome_html | safe }}</div>
        {% if questions_html %}{{ questions_html | safe }}{% endif %}
    </div>
</div>
