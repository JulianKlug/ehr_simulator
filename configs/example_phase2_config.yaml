# Phase 2 example study configuration — synthetic dataset, randomisation on.
#
# Same patients and timepoints as example_config.yaml, but the
# `randomisation` block switches `serve` to Phase 2 study mode: clinicians
# get cases through **Start case** instead of picking patients. Its own
# study_id gives it its own database (data/study_example_phase2.db), so it
# never collides with the Phase 1 example.
#
# Pair it with the first use case questions (schema v2, branching):
#
#   uv run ehr-simulator validate-config configs/example_phase2_config.yaml configs/example_phase2_questions.yaml
#   uv run ehr-simulator activate-config configs/example_phase2_config.yaml configs/example_phase2_questions.yaml \
#       --version v1 --description "Phase 2 example"
#   uv run ehr-simulator serve --config  configs/example_phase2_config.yaml --questions configs/example_phase2_questions.yaml
#
# Editing this file changes config_hash: stop the server, activate a new
# --version, restart.

schema_version: "2"
study_id: example_phase2
dataset: synthetic

patient_ids:
  - synth_001
  - synth_002
  - synth_003

time_unit: minutes
timepoints: [0, 60, 180]

# Each block_sequence entry is one block of block_length cases; `start` =
# the clinician's starting arm, `other` = the opposite arm. One cycle must
# hold equal start/other counts, and the first
# target_completed_cases_per_clinician positions must split 50:50 (block_length
# 2 with target 2 would give 2:0). master_seed: 0 .. 2^63 - 1.
randomisation:
  master_seed: 123456
  block_length: 1
  block_sequence: [start, other]

# S11e case lifecycle (optional; without it no timeout, pause or stopping
# limit applies). A case silent longer than reconnection_grace_seconds
# (>= 180) becomes incomplete on its next contact; a voluntary pause longer
# than its grace (null → reconnection grace) does too. Start case stops at
# either per-clinician limit; study_target_completed_cases is display-only
# (`case-status`). Limits are sized to this 3-patient example.
case_lifecycle:
  reconnection_grace_seconds: 300
  voluntary_pause_enabled: true
  voluntary_pause_grace_seconds: null
  target_completed_cases_per_clinician: 2
  max_activated_cases_per_clinician: 3
  study_target_completed_cases: null
  # S11f: an incomplete case gets one replacement from the clinician's own
  # unused schedule items (same arm first). Omitted/false keeps the hash.
  replacement_cases_enabled: false

# S11g frozen AI intervention (required with `randomisation`). AI assigned
# cases show the `model_id` row for exactly the current timepoint; boot and
# preflight refuse when the loaded artifact's identity differs. The hash is
# the synthetic adapter's canonical ai_output digest.
ai_intervention:
  model_id: demo_v0
  model_system_version: synthetic_demo_v0
  prediction_artifact_sha256: 90c5448853d63e90b68310a26ba5bab110070a6334e94e0e07c64d6f2d245ca9
  explanation_artifact_sha256: null
  presentation_version: ai_panel_v1
  intervention_build_id: example_phase2_build

# S11g: `<source>:<name>` fields that encode the reference outcome and must
# never be clinician facing (sources: admission, scalar, imaging, ai).
# Preflight fails if one is shown. `[]` declares that none exist.
# First use case: the deterioration label must never reach any panel.
# The 3-month mRS 0-2 and 3-month death labels must be added here too once
# their exact column names are known (gate §26.10).
clinician_facing:
  prohibited_fields:
    - admission:early_neurological_deterioration
    - scalar:early_neurological_deterioration
    - ai:early_neurological_deterioration

# S11i clinician-facing policies, pinned per case. backward_navigation is
# required once this block exists (allow_readonly: earlier timepoints stay
# viewable read-only and each revisit is logged; prohibit: only the current
# timepoint). Feedback flags must stay false (no feedback is implemented).
# Practice cases (enabled: true) need their own patient_ids, disjoint from
# patient_ids in every version. Free text is off; enabling it makes
# `routine_export` decide whether export-answers includes those columns.
# First use case: allow_readonly (gate §10.1).
study_behaviour:
  backward_navigation: allow_readonly
  feedback:
    show_ground_truth: false
    show_correctness: false
    show_running_score: false
    show_ai_correctness: false
  practice:
    enabled: false
    patient_ids: []
    arm: no_ai
  free_text:
    enabled: false
    routine_export: exclude

# S11j/S11k behavioural telemetry, pinned per case (preflight requires it
# with `randomisation`). Active time stops inactivity_threshold_seconds
# after the last click/touch/scroll/key/answer; a panel is exposed while
# >= panel_viewport_threshold of its expanded content is on screen in a
# visible, focused tab, and "viewed" after panel_viewed_threshold_seconds
# of cumulative exposure per timepoint. First use case: 60 s, 5 %, 2 s.
telemetry:
  inactivity_threshold_seconds: 60
  panel_viewport_threshold: 0.05
  panel_viewed_threshold_seconds: 2.0
